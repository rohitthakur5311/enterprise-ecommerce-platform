global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8000"]

  - job_name: catalog
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog:8000"]

  - job_name: orders
    metrics_path: /metrics
    static_configs:
      - targets: ["orders:8000"]
